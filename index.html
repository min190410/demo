<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>html{-webkit-text-size-adjust:100%}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>교원인사</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Nanum+Myeongjo:wght@400;700&family=Nanum+Pen+Script&display=swap">
<style>
:root{
  /* Layout: 로그인(좌 7463C 면 / 우 입력) → 홈(좌 메뉴 / 우 알림 · 캘린더 · 진행) · 직원 전용 전체 모아보기(학과 × 업무 단계 바둑판) */
  --black:#000000; --white:#ffffff; --navy:#002b49; /* PANTONE 7463 C */ --silver:#8a8d8f; /* PANTONE 877 C */
  --hair:rgba(138,141,143,.35); --tint:rgba(0,43,73,.12);
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
@media (min-width:901px){html,body{overflow:hidden}}
body{margin:0;background:var(--white);color:var(--black);font:300 14px/1.5 var(--font);letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:1px solid var(--navy);outline-offset:3px}
#app{height:100%}

/* 로그인 */
.login{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);height:100%}
.login .side{background:var(--white);color:var(--navy);display:flex;align-items:flex-end;
  padding-block:56px;padding-left:max(56px,env(safe-area-inset-left,0px));padding-right:56px}
.mark{font-weight:500;font-size:13px;letter-spacing:.4em}
.login .side{align-items:center;justify-content:center}
.brandc{display:flex;flex-direction:column;align-items:center;gap:28px;text-align:center}
.brandc .emb{width:300px;height:300px;border-radius:50%;background:var(--white);display:grid;place-items:center;overflow:hidden}
.brandc .emb svg,.brandc .emb img{width:88%;height:88%;object-fit:contain}
.brandc .emb img+svg{display:none}
.brandc p{margin:0;font-size:15px;letter-spacing:.2em;font-weight:300;line-height:1.9}
.brandc b{font-weight:500;font-size:19px;letter-spacing:.12em}
@media (max-width:720px){.brandc{flex-direction:row;gap:16px;text-align:left}.brandc .emb{width:128px;height:128px}.brandc p{font-size:12px}.brandc b{font-size:15px}}
.login{background:var(--navy)}
.login form{color:var(--white);display:flex;flex-direction:column;justify-content:center;gap:40px;width:min(320px,100%);margin:0 auto;padding-block:48px}
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-size:11px;letter-spacing:.2em;color:var(--silver);font-weight:400}
.f input{color:var(--white);border:0;border-bottom:1px solid var(--silver);padding:8px 0;outline:none;background:transparent;font-weight:400;font-size:16px;border-radius:0}
.f input:focus{border-bottom-color:var(--white)}
.login :focus-visible{outline-color:var(--white)}
.go{background:var(--white);color:var(--navy);height:48px;font-weight:400;letter-spacing:.3em;font-size:13px}
.go:hover{background:var(--silver);color:var(--white)}
.err{font-size:12px;color:var(--white);min-height:18px;margin-top:-28px}
@media (max-width:720px){
  .login{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  .login .side{padding:28px max(24px,env(safe-area-inset-left,0px));min-height:120px}
  .login form{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));width:100%;max-width:368px}
}

/* 홈 */
.home{display:grid;grid-template-columns:300px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100%}
nav{background:var(--navy);color:var(--white);display:flex;flex-direction:column;min-height:0;overflow:auto;
  padding-block:32px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:28px;gap:48px}
nav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
nav li button{width:100%;text-align:left;padding:9px 0;color:rgba(255,255,255,.62);font-weight:300;font-size:14px;transition:color .15s}
nav li button:hover{color:var(--white)}
nav li button.on{color:var(--white);font-weight:500}
nav li button.on::before{content:"";display:inline-block;width:12px;height:1px;background:var(--white);vertical-align:middle;margin-right:10px}
nav .top{display:flex;align-items:center;gap:14px}
nav .mark{color:var(--white);font:inherit;font-weight:500;font-size:13px;letter-spacing:.4em;padding:0}
nav .bell{display:inline-flex;align-items:center;gap:4px;color:rgba(255,255,255,.62);padding:2px}
nav .bell:hover,nav .bell.on{color:var(--white)}
nav .bell span{font-size:10.5px;font-weight:500;line-height:15px;min-width:15px;padding:0 4px;border-radius:8px;background:var(--white);color:var(--navy);text-align:center;font-variant-numeric:tabular-nums}
nav .par{display:flex;justify-content:space-between;align-items:center}
nav .par.act{color:var(--white)}
nav .car{font-style:normal;font-size:13px;color:rgba(255,255,255,.45);width:12px;text-align:center}
nav ul.sub{margin:2px 0 8px;padding-left:14px;border-left:1px solid rgba(255,255,255,.18);gap:0}
nav ul.sub button{font-size:13px;padding:6px 0;line-height:1.4;white-space:nowrap}
nav ul.sub button.on::before{width:8px;margin-right:8px}
nav li.gap{margin-top:18px;padding-top:18px;border-top:1px solid rgba(255,255,255,.18)}
nav .me{margin-top:auto;display:flex;flex-direction:column;gap:2px;font-size:13px}
nav .me span{color:rgba(255,255,255,.62);font-size:12px}
nav .me button{margin-top:14px;align-self:flex-start;font-size:11px;letter-spacing:.2em;color:rgba(255,255,255,.62)}
nav .me button:hover{color:var(--white)}
nav :focus-visible{outline-color:var(--white)}

main{display:flex;flex-direction:column;gap:40px;min-width:0;min-height:0;height:100%;overflow:auto;
  padding-block:32px 40px;padding-left:40px;padding-right:max(40px,env(safe-area-inset-right,0px))}
.blk{border-top:1px solid var(--black);padding-top:14px;min-width:0;flex:none}
.hd{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px 14px;margin-bottom:14px}
.hd h2{margin:0;font-size:11px;letter-spacing:.3em;font-weight:500}
.hd .n{font-size:11px;color:var(--silver);font-variant-numeric:tabular-nums}
.hd .sp{flex:1}
.ctl{display:flex;align-items:center;gap:18px;font-size:13px;font-variant-numeric:tabular-nums}
.ctl button{color:var(--silver);font-size:15px;line-height:1;width:20px;height:20px}
.ctl button:hover{color:var(--black)}

/* 알림 5행 */
.noti{display:flex;flex-direction:column}
.noti button{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:16px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--hair);text-align:left;width:100%}
.noti button:last-child{border-bottom:0}
.noti .k{font-size:11px;letter-spacing:.12em;font-weight:500;justify-self:start}
.noti .k.req{background:var(--black);color:var(--white);padding:1px 7px}
.noti .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400}
.noti .read .t{font-weight:300;color:var(--silver)}
.noti time{font-size:12px;color:var(--silver);font-variant-numeric:tabular-nums}

/* 업무별 표식 (팔레트 안에서 채움·틴트·외곽선으로 구분) */
.c-full{background:var(--navy);color:var(--white)}
.c-non{background:var(--black);color:var(--white)}
.c-re{background:var(--silver);color:var(--black)}
.c-pos{background:var(--white);color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.c-sab{background:var(--tint);color:var(--navy)}
.c-lec{background:var(--white);color:var(--black);box-shadow:inset 0 0 0 1px var(--silver)}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;font-weight:400}
.lg span{display:inline-flex;align-items:center;gap:6px}
.lg i{width:14px;height:10px;display:inline-block}
.calhd{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.calhd h2{font-size:22px;font-weight:700;letter-spacing:0;margin:0}
.calhd .ctl{font-size:22px;font-weight:700;justify-content:center}
.calhd .ctl button{font-size:22px;width:26px;height:26px}
.calhd .lg2{justify-content:flex-end}
@media (min-width:901px){
  .calhd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
  .calhd .ctl{grid-column:2;justify-self:center}
  .calhd .lg2{grid-column:3;justify-self:end;display:grid;grid-template-rows:repeat(2,auto);grid-auto-flow:column;gap:5px 18px}
}

/* 캘린더 */
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--hair)}
.dow{font-size:11px;letter-spacing:.15em;color:var(--silver);padding:0 8px 8px;font-weight:400;border-right:1px solid var(--hair)}
.day{border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:6px 6px 8px;min-height:96px;display:flex;flex-direction:column;gap:3px;min-width:0}
.day:nth-child(-n+14){border-top:1px solid var(--hair)}
.day .d{font-size:12px;font-variant-numeric:tabular-nums;width:22px;height:22px;display:grid;place-items:center;margin-left:-2px;font-weight:400}
.day.out .d{color:var(--hair)}
.day.sun .d{color:var(--silver)}
.day.today .d{background:var(--black);color:var(--white);border-radius:50%}
.ev{font-size:11.5px;line-height:1.5;padding:1px 6px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.c-full{background:var(--navy);color:var(--white);box-shadow:none}
.ev.c-non{background:var(--black);color:var(--white);box-shadow:none}
.ev.c-re{background:var(--silver);color:var(--white);box-shadow:none}
.ev.c-pos{background:var(--navy);color:var(--white);box-shadow:none}
.ev.c-sab{background:var(--navy);color:var(--white);box-shadow:none}
.ev.c-lec{background:var(--silver);color:var(--white);box-shadow:none}
.ev.dl{font-weight:700;background:var(--white);box-shadow:inset 0 0 0 1px var(--black)}
.ev.dl.c-full{color:var(--navy)}
.ev.dl.c-non{color:var(--black)}
.ev.dl.c-re{color:var(--silver)}
.ev.dl.c-pos{color:var(--navy)}
.ev.dl.c-sab{color:var(--navy)}
.ev.dl.c-lec{color:var(--silver)}
.ev.cont{min-height:19px}
.more{font-size:11px;color:var(--silver)}

/* 진행 */
.prog{display:flex;flex-direction:column}
.prog .r{display:grid;grid-template-columns:minmax(150px,240px) minmax(0,1fr) 170px 80px;gap:20px;align-items:center;padding:11px 0;border-bottom:1px solid var(--hair)}
.prog .r:last-child{border-bottom:0}
.prog .nm{font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog .st{font-size:13px;color:var(--silver);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{display:flex;gap:3px}
.bar i{height:3px;flex:1;background:var(--hair)}
.bar i.on{background:var(--silver)}
.bar i.cur{background:var(--navy)}
.tag{font-size:11px;letter-spacing:.1em;justify-self:end;font-weight:500;color:var(--navy);white-space:nowrap}
.tag.req{background:var(--black);color:var(--white);padding:2px 7px}

/* 전체 모아보기 */
.board{overflow:auto;max-width:100%;border-top:1px solid var(--hair)}
.board table{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.board th,.board td{border-bottom:1px solid var(--hair);padding:0;height:34px}
.board thead th{position:sticky;top:0;background:var(--white);z-index:2;font-weight:500;font-size:12.5px;padding:10px 8px;vertical-align:bottom;border-bottom:1px solid var(--black);white-space:nowrap;text-align:center;min-width:92px}
.board thead th:first-child{left:0;z-index:3;text-align:left;min-width:0}
.board tbody th{position:sticky;left:0;background:var(--white);z-index:1;text-align:left;font-weight:300;padding:0 20px 0 0;white-space:nowrap}
.board tbody th .who{display:inline-block;width:58px;font-size:10.5px;letter-spacing:.08em;color:var(--silver)}
.board tbody th .who.me{color:var(--navy);font-weight:500}
.board tr.grp th,.board tr.grp td{height:auto;padding:22px 0 8px;border-bottom:1px solid var(--black)}
.board tr.grp th{font-weight:500;font-size:13px;display:flex;align-items:center;gap:10px}
.board tr.grp th i{width:14px;height:10px;display:inline-block}
.board tr.grp td{text-align:center;font-size:11px;color:var(--silver);font-variant-numeric:tabular-nums}
.board td{text-align:center}
.board tbody td{border-bottom:0}
.seg{display:block;background:var(--hair);opacity:.45}
.seg.v{margin:0 auto;width:22px;height:35px}
.seg.v.top{border-radius:2px 2px 0 0}.seg.v.bot{border-radius:0 0 2px 2px}
.seg.done{background:var(--silver);opacity:1}
.seg.cur{background:var(--navy);opacity:1}
.seg.rq{background:var(--black);opacity:1}
.bl .seg{width:14px;height:10px;display:inline-block;margin:0}
.flts{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.flt{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.fl{width:56px;font-size:11px;letter-spacing:.2em;color:var(--silver);font-weight:500}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--hair);padding:5px 12px;font-size:12.5px;font-weight:400;color:var(--black);border-radius:999px}
.chip:hover{border-color:var(--black)}
.chip.on{background:var(--black);color:var(--white);border-color:var(--black)}
.chip i{width:10px;height:8px;display:inline-block}
.chip.on i{box-shadow:0 0 0 1px var(--white)}
.byc.one thead th{min-width:420px}
.board table.byc{table-layout:fixed;width:100%}
.byc tr>th:first-child{width:180px}
.board .byc tr.grp th{display:table-cell}
.board .byc thead th{min-width:0;text-align:left;padding-left:12px}
.vw{display:flex;gap:16px;margin-left:12px}
.vw button{font-size:12.5px;color:var(--silver);font-weight:400;padding-bottom:2px;border-bottom:1px solid transparent}
.vw button.on{color:var(--black);border-bottom-color:var(--black);font-weight:500}
.byc thead th{min-width:170px}
.board .byc tbody th{padding-right:28px}
.board tr.hr td,.board tr.hr th{height:auto;padding-block:12px;border-bottom:1px solid var(--hair)}
.board tr.hr td{padding-inline:12px}
.hb{display:flex;gap:2px;width:100%}
.seg.h{flex:1;height:10px}
.hs{font-size:11.5px;color:var(--silver);text-align:left;margin-top:5px;min-height:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.hs.rqs{color:var(--black);font-weight:500}
.pct{font-size:11.5px;color:var(--silver);font-variant-numeric:tabular-nums;font-weight:400}
.pct.rqt{background:var(--black);color:var(--white);padding:1px 6px;font-size:11px}
nav .cnt{display:inline-block;min-width:18px;margin-left:8px;padding:0 5px;background:var(--white);color:var(--navy);font-size:11px;font-weight:500;line-height:18px;text-align:center;border-radius:9px;font-variant-numeric:tabular-nums}
.cell{display:inline-block;width:14px;height:14px;vertical-align:middle}
.cell.done{background:var(--navy);width:8px;height:8px}
.cell.cur{background:var(--black);width:16px;height:16px}
.cell.rq{background:var(--white);box-shadow:inset 0 0 0 2px var(--black);width:16px;height:16px}
.cell.no{width:3px;height:3px;background:var(--hair);border-radius:50%}
.bl{display:flex;gap:18px;font-size:12px;align-items:center;font-weight:400}
.bl span{display:inline-flex;align-items:center;gap:7px}

/* 전임교원 초빙 */
.flist{display:flex;flex-direction:column}
.fr{display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr) 180px 70px;gap:20px;align-items:center;padding:14px 0;border-bottom:1px solid var(--hair);text-align:left;width:100%}
.fr:hover .nm{text-decoration:underline;text-underline-offset:4px}
.fr .nm{font-weight:400}.fr .st{font-size:13px;color:var(--silver)}.fr .st.rqs{color:var(--black);font-weight:500}
.fr .tag{font-size:11px;letter-spacing:.1em;color:var(--navy);font-weight:500;justify-self:end}
.fr.dn{grid-template-columns:minmax(0,290px) 90px minmax(0,1fr)}
.fr.sl{grid-template-columns:minmax(0,290px) minmax(0,1fr) 70px}
.sb{font-size:11px;letter-spacing:.12em;color:var(--silver);font-weight:500}
.sb.on{color:var(--white);background:var(--navy);padding:2px 9px;justify-self:start}
.done-bar{display:flex;gap:16px;align-items:baseline;border-top:3px solid var(--navy);padding-top:10px;margin:6px 0 28px}
.done-bar b{font-size:11px;letter-spacing:.2em;font-weight:500;color:var(--navy)}
.done-bar span{font-size:12px;color:var(--silver);font-variant-numeric:tabular-nums}
.done-bar em{font-style:normal;font-size:12.5px;margin-left:auto;color:var(--black)}
.done-bar b,.done-bar span{white-space:nowrap}
.cg{margin-bottom:30px}
.orgrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-2px 0 28px;flex-wrap:wrap}
.orgrow .org{margin:0}
.b2.sm.on{background:var(--black);color:var(--white)}
.frm.off{opacity:.35;pointer-events:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:30;padding:16px}
.dlg{background:var(--white);width:min(420px,100%);padding:28px 28px 22px;display:flex;flex-direction:column;gap:10px}
.dlg p{margin:0;font-size:16px;font-weight:500}
.dlg span{font-size:13px;color:var(--silver);line-height:1.6}
.dact{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.ftabs{display:flex;gap:0;border-bottom:1px solid var(--black);margin:-6px 0 24px}
.ftabs button{display:flex;gap:10px;align-items:baseline;padding:10px 22px 10px 0;font-size:14px;color:var(--silver);border-bottom:3px solid transparent;margin-bottom:-1px;margin-right:22px}
.ftabs button span{font-size:11px;font-variant-numeric:tabular-nums}
.ftabs button.on{color:var(--black);border-bottom-color:var(--navy);font-weight:500}
.tw2{overflow-x:auto}
.fnt{min-width:780px}
.ft.fnt th{text-align:center;padding:6px 6px 8px;border-bottom:1px solid var(--hair);vertical-align:middle}
.fnt thead tr:last-child th{border-bottom:1px solid var(--black)}
.ft.fnt td{padding:4px 6px;vertical-align:middle}
.fnt td.c{text-align:center}
.fnt .lg2{font-size:11.5px;color:var(--silver);text-align:center}
.fnt tbody.fnr tr:last-child td{border-bottom:1px solid var(--black)}
.fnt tbody.fnr tr:first-child td{border-bottom:1px solid var(--hair)}
.fnt tbody.fnr tr:first-child td[rowspan]{border-bottom:1px solid var(--black)}
.fnt .num{text-align:right}
.tick{width:30px;height:30px;border:1px solid var(--silver);font-size:15px;line-height:1;color:var(--white)}
.tick.on{background:var(--black);border-color:var(--black)}
.ox{display:inline-flex;border:1px solid var(--silver)}.ox button{width:32px;height:30px;font-size:13px;color:var(--silver)}.ox button+button{border-left:1px solid var(--silver)}
.ox button.on{background:var(--black);color:var(--white)}
.gl{margin:14px 0 0;padding-left:18px;font-size:12.5px;color:var(--navy);line-height:1.8}
.linked{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--tint);padding:9px 14px;font-size:12.5px;color:var(--navy);margin-bottom:22px;flex-wrap:wrap}
.minhd{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap;margin-bottom:12px}
.minhd h3{margin:4px 0 0;font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.45;flex:1;min-width:240px;text-wrap:balance}
.mbox{margin:0;border:1px solid var(--black);min-width:300px}
.mbox>div{display:grid;grid-template-columns:110px minmax(0,1fr);align-items:center;border-bottom:1px solid var(--hair)}
.mbox>div:last-child{border-bottom:0}
.mbox dt{font-size:12px;color:var(--silver);padding:8px 12px;border-right:1px solid var(--hair)}
.mbox dd{margin:0;padding:4px 10px;font-size:13px}.mbox dd b{font-weight:500;font-size:16px;font-variant-numeric:tabular-nums}

function initOne(cv){
  if(!cv||cv.dataset.ok)return;cv.dataset.ok=1;
  const x=cv.getContext('2d');x.lineWidth=2.2;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#000';
  let on=false;const pt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  cv.addEventListener('pointerdown',e=>{on=true;cv.setPointerCapture(e.pointerId);const [a,b]=pt(e);x.beginPath();x.moveTo(a,b);cv.dataset.ink=1});
  cv.addEventListener('pointermove',e=>{if(!on)return;const [a,b]=pt(e);x.lineTo(a,b);x.stroke()});

}

  let h=`<section class="blk fd"><div class="hd"><h2>보직 변동 여부 회신서</h2><span class="n">발령 예정 ${dk(POSD.s)}</span></div>
  <div class="orgrow"><div class="org">${orgLine(j)}</div></div>`;
  if(!op&&v<=0)return h+closedBox('pos')+'</section>';
  if(!ed){const last=f.log.find(l=>/제출/.test(l.t));h+=`<div class="done-bar"><b>제출 완료</b><span>${last?last.at:''}</span><em>${DONE_MSG}</em></div>`}
  if(open.length)h+=`<div class="alert"><b>수정요청 ${open.length}</b>${open.map(x=>`<div>${esc(x.l)} — ${esc(x.x)}</div>`).join('')}</div>`;
  const inp=(i,k,ph,w)=>`<input class="in" id="ps${i}${k}" data-pf="${i}.${k}" value="${esc(f.items[i][k])}"${ph?` placeholder="${ph}"`:''}${w?` style="max-width:${w}px"`:''}${dis}>`;
  if(ed)h+=`<p class="guide pstop">보직마다 1장씩 작성됩니다. 2개 이상 보직을 겸직하면 아래 <b>[+ 보직 추가]</b>로 보직별로 각각 작성하세요.</p>`;
  f.items.forEach((x,i)=>{
    h+=`<div class="pcard${posFlag(f,'i'+i)?' flag':''}"><div class="pch"><b>보직 ${i+1}</b>${ed&&f.items.length>1?`<button class="lnk" data-a="psdel" data-i="${i}">삭제</button>`:''}</div>
    <ol class="frm">
    <li><div class="q"><span>1</span>구분</div><div class="a"><span class="seg3">${POS_KIND.map(([k,l])=>`<button class="${x.kind===k?'on':''}" data-a="pskind" data-i="${i}" data-v="${k}" aria-pressed="${x.kind===k}"${dis}>${l}</button>`).join('')}</span>
      <p class="guide">${x.kind==='chg'?'보직교원이 바뀌는 경우':x.kind==='same'?'보직 변동이 없는 경우에도 반드시 회신해야 합니다.':x.kind==='abol'?'학칙 또는 직제 등에 없는 보직은 폐지가 원칙입니다. 단, 재학생(재적생)이 있으면 보직을 유지할 수 있습니다.':'해당하는 구분을 하나 고르세요.'}</p></div></li>
    <li><label class="q" for="ps${i}name"><span>2</span>보직명</label><div class="a">${inp(i,'name','예) ○○대학 ○○○학과장')}</div></li>`;
    if(x.kind==='chg')h+=`<li><div class="q"><span>3</span>현재 보직교원</div><div class="a"><div class="pr2"><label>직급${inp(i,'cr','예) 교수')}</label><label>성명${inp(i,'cn')}</label></div></div></li>
    <li><div class="q"><span>4</span>변경 보직교원</div><div class="a"><div class="pr2"><label>직급${inp(i,'nr','예) 부교수')}</label><label>성명${inp(i,'nn')}</label></div>
      <p class="guide">회신 기한 안에 후임자가 정해지지 않았다면 성명에 <b>변경 예정</b>이라고 적으세요. 후임자가 정해지면 교무행정팀으로 바로 알려야 하며, ${dk(POSD.late)}자 발령으로 처리될 수 있습니다.</p></div></li>
    <li><div class="q"><span>5</span>발령일자 조정</div><div class="a"><div class="chk">
      <label><input type="radio" name="adj${i}" data-padj="${i}" value="no"${x.adj!=='yes'?' checked':''}${dis}><i></i>조정 불필요 — ${dk(POSD.s)}자</label>
      <label><input type="radio" name="adj${i}" data-padj="${i}" value="yes"${x.adj==='yes'?' checked':''}${dis}><i></i>조정 필요</label></div>
      ${x.adj==='yes'?`<div class="pr2"><label>요청 발령일${DF(`id="ps${i}ad" data-pf="${i}.ad"`,x.ad,dis)}</label></div>`:''}
      <p class="guide">후임자가 연구년 등의 사유로 발령일 조정이 필요한 경우에만 ‘조정 필요’를 고르고 요청 발령일을 적으세요.</p></div></li>`;
    else if(x.kind)h+=`<li><div class="q"><span>3</span>${x.kind==='same'?'보직교원':'현재 보직교원'}</div><div class="a"><div class="pr2"><label>직급${inp(i,'cr','예) 교수')}</label><label>성명${inp(i,'cn')}</label></div>
      <p class="guide">${x.kind==='same'?'보직변동여부란에 “변동사항 없음”으로 표시됩니다.':'비고란에 “아래 기타사항 5번 참조”로 표시됩니다.'}</p></div></li>`;
    h+=`</ol>${(()=>{const c=posFlag(f,'i'+i);return c?`<div class="cmt">${esc(c.x)}</div>`:''})()}</div>`;
  });
  if(ed)h+=`<button class="add" data-a="psadd">+ 보직 추가 (겸직 시)</button>`;
  h+=`<ol class="frm" style="margin-top:28px">
  <li class="${posFlag(f,'files')?'flag':''}"><div class="q"><span>·</span>관련근거<small>신설 보직인 경우</small></div><div class="a">${fileList(f.files,ed,'psf')}${ed?`<button class="add" data-a="psfup">+ PC에서 파일 업로드</button><input type="file" id="psff" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" multiple hidden><p class="guide">신설 보직은 관련근거를 함께 제출해야 합니다. PDF·JPG·PNG, 파일당 10MB 이하.</p>`:f.files.length?'':'<span class="ro">—</span>'}${(()=>{const c=posFlag(f,'files');return c?`<div class="cmt">${esc(c.x)}</div>`:''})()}</div></li>
  <li><div class="q"><span>·</span>유의 사항</div><div class="a"><ol class="pnotes">${posNotes().map(n=>`<li>${n[0]}${n[1]?`<div class="nsub">${n[1]}</div>`:''}</li>`).join('')}</ol></div></li>
  <li><div class="q"><span>·</span>작성일</div><div class="a"><span class="ro">${todayK()}</span></div></li>
  <li class="${posFlag(f,'sign')?'flag':''}"><div class="q"><span>·</span>${headTitle(j)} 서명</div><div class="a">
    <div class="sigrow"><span class="who">${DEPTS[j]} ${headTitle(j)} <b>${esc(headName(j))}</b></span>
    ${f.sign?`<span class="sigbox has">${sigMark(f.sign)}</span>${ed?`<button class="lnk" data-a="pssigredo">다시 서명</button>`:''}`
      :S.psSigOpen?`<span class="pad"><canvas id="pssig" width="320" height="110" aria-label="서명 입력"></canvas><span class="padact"><button class="lnk" data-a="pssigclr">지우기</button><button class="lnk" data-a="pssigok">서명 완료</button></span></span>`
      :`<button class="sigbox" data-a="pssigopen"${dis}>서명하기</button>`}</div>${(()=>{const c=posFlag(f,'sign');return c?`<div class="cmt">${esc(c.x)}</div>`:''})()}</div></li></ol>`;
  if(S.fmsg)h+=`<div class="ferr" role="alert">${esc(S.fmsg)}</div>`;
  h+=`<div class="act">${ed?`<button class="b2" data-a="pssave">임시저장</button><button class="b1" data-a="pssubmit">${open.length?'재제출':'제출'}</button>`:`<span class="stline">${pw(j)?'학사종합지원센터 확인 완료':'학사종합지원센터 확인 중'}</span>`}</div>`;
  return h+'</section>';
}
function posValid(j){
  const f=PS[j];
  for(let i=0;i<f.items.length;i++){const x=f.items[i],n=`보직 ${i+1}: `;
    if(!x.kind)return n+'구분(보직 변동 / 변동 없음 / 보직 폐지)을 고르세요.';
    if(!x.name.trim())return n+'보직명을 입력하세요.';
    if(!x.cr.trim()||!x.cn.trim())return n+(x.kind==='chg'?'현재 보직교원의 직급과 성명을 입력하세요.':'직급과 성명을 입력하세요.');
    if(x.kind==='chg'){if(!x.nn.trim())return n+'변경 보직교원의 성명을 입력하세요. 후임자가 정해지지 않았다면 ‘변경 예정’으로 적으세요.';
      if(!x.nr.trim()&&x.nn.trim()!=='변경 예정')return n+'변경 보직교원의 직급을 입력하세요.';
      if(x.adj==='yes'&&!x.ad)return n+'조정할 발령일을 입력하세요.';}
  }
  if(!f.sign)return `${headTitle(j)} 서명을 해 주세요.`;
  return '';
}
/* 양식 — 원본(보직 변동 여부 회신서) 배치를 그대로 따름 */
function posSheet(j,i){
  const f=PS[j],x=f.items[i]||bPos(),k=x.kind,F=v=>`<b class="fill">${esc(v||'')}</b>`;
  const at=f.sign&&f.sign.at?f.sign.at:'',dt=f.subDate||'';

  const side=t=>`<th class="vl" rowspan="2">${t.split('').join('<br>')}</th>`;
  const nmh='<th class="h nm">보직명<small>예) ‘○○대학 ○○○학과장’</small></th>';
  return `<div class="sheet pss"><div class="pttl">보직 변동 여부 회신서</div>
  <table class="pf"><colgroup><col style="width:5%"><col style="width:31%"><col style="width:11.5%"><col style="width:4.5%"><col style="width:16%"><col style="width:11.5%"><col style="width:20.5%"></colgroup>

    <tr><th class="h ex">예) ‘○○대학 ○○○학과장’</th><th class="h">직급</th><th class="h" colspan="2">성명</th><th class="h">직급</th><th class="h">성명</th></tr>
    <tr class="tall"><td class="c">${k==='chg'?F(x.name):''}</td><td class="c">${k==='chg'?F(x.cr):''}</td><td class="c" colspan="2">${k==='chg'?F(x.cn):''}</td><td class="c">${k==='chg'?F(x.nr):''}</td><td class="c">${k==='chg'?F(x.nn):''}</td></tr>
    <tr class="ar"><td class="adj" rowspan="3"><b>발령일자 조정</b><small>후임자가 연구년 등 사유로 발령일 조정 필요 시,<br>‘조정필요’란에 체크(√)후 별도 일자 기재</small></td><td class="h it">해당란에</td><td class="h c">√</td><td colspan="3"></td></tr>
    <tr class="ar"><td class="it c">조정불필요</td><td class="c">${chk(k==='chg'&&x.adj!=='yes')}</td><td colspan="3" class="c dts"><b>${dk(POSD.s)}자</b></td></tr>
    <tr class="ar"><td class="it c">조정필요</td><td class="c">${chk(k==='chg'&&x.adj==='yes')}</td><td colspan="3" class="dts"><div class="d2"><b>${dk(POSD.s)}자</b><span>⇨</span><b>${k==='chg'&&x.adj==='yes'&&x.ad?`<span class="fill">${dk(x.ad)}자</span>`:`${POSD.s.slice(0,4)}. &nbsp;&nbsp;&nbsp;. &nbsp;&nbsp;&nbsp;.자`}</b></div></td></tr>
  </table>
  <table class="pf pf2"><colgroup><col style="width:5%"><col style="width:31%"><col style="width:11.5%"><col style="width:20.5%"><col style="width:32%"></colgroup>
    <tr><th class="vl" rowspan="2">변<br>동<br>없<br>을<br>시</th>${nmh}<th class="h">직급</th><th class="h">성명</th><th class="h">보직변동여부</th></tr>
    <tr class="tall"><td class="c">${k==='same'?F(x.name):''}</td><td class="c">${k==='same'?F(x.cr):''}</td><td class="c">${k==='same'?F(x.cn):''}</td><td class="c"><b>“ 변동사항 없음 ”</b></td></tr>
  </table>
  <table class="pf pf2"><colgroup><col style="width:5%"><col style="width:31%"><col style="width:11.5%"><col style="width:20.5%"><col style="width:32%"></colgroup>
    <tr><th class="vl" rowspan="2">보<br>직<br>폐<br>지<br>시</th>${nmh}<th class="h">직급</th><th class="h">성명</th><th class="h">비고</th></tr>
    <tr class="tall"><td class="c">${k==='abol'?F(x.name):''}</td><td class="c">${k==='abol'?F(x.cr):''}</td><td class="c">${k==='abol'?F(x.cn):''}</td><td class="c"><b>“ 아래 기타사항 5번 참조”</b></td></tr>
  </table>
  <div class="pnt"><p class="h">◎ 유의 사항</p>${posNotes().map((n,k)=>`<div class="nl"><span class="no">${k+1}.</span><span>${n[0]}</span></div>${n[1]?`<div class="nsub">${n[1]}</div>`:''}`).join('')}</div>
  <p class="pdt">${dt||'&nbsp;&nbsp;&nbsp;&nbsp;.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;.&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;.'}</p>
  <div class="psg"><div class="l1">부학(원)장/학과(부)장/주임교수/연구소장</div><div class="l2"><span>성 명</span><b class="fill">${esc(headName(j))}</b><span class="mk">(서명<br>또는 인)${f.sign?`<span class="sgov">${sigMark(f.sign)}</span>`:''}</span></div></div>
  </div>`;
}

function posXlsxRows(J){
  return J.flatMap(j=>PS[j].items.filter(x=>x.kind).map(x=>{
    if(x.kind==='same')return [x.name,x.cn,'N','','',''];
    if(x.kind==='abol')return [x.name,x.cn,'Y','보직 폐지','',''];
    const adj=x.adj==='yes'&&x.ad;return [x.name,x.cn,'Y',x.nn,adj?x.ad:POSD.s,adj?'Y':'N'];
  }));
}
async function posXlsx(){
  const J=posXlsxJs();if(!J.length)return;
  S.fmsg='엑셀을 만드는 중입니다.';render();
  try{
    const dl=await getDl();
    if(!dl){S.fmsg='이 화면에서는 파일을 내려받을 수 없습니다. 게시된 페이지에서 다시 시도하세요.';render();return}
    await loadJS('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js');
    const bin=atob(POS_XLSX_B64),buf=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);
    const wb=new window.ExcelJS.Workbook();await wb.xlsx.load(buf.buffer);const ws=wb.worksheets[0];
    ws.getCell('E2').value=`발령일자(${POSD.s.slice(0,4)}-MM-DD)`;
    const tpl=[1,2,3,4,5,6].map(k=>JSON.parse(JSON.stringify(ws.getRow(4).getCell(k).style||{})));
    const rows=posXlsxRows(J),last=Math.max(ws.rowCount,2+rows.length);
    for(let r=3;r<=last;r++){const row=ws.getRow(r);for(let k=1;k<=6;k++){const c=row.getCell(k),v=rows[r-3]?rows[r-3][k-1]:null;
      c.style=JSON.parse(JSON.stringify(tpl[k-1]));
      if(k===5&&v){const [y,m,d]=v.split('-').map(Number);c.value=new Date(Date.UTC(y,m-1,d));c.numFmt='yyyy-mm-dd'}else c.value=v===''?null:v}}
    const out=await wb.xlsx.writeBuffer();
    await dl.save({filename:`보직변동 현황 집계표_${dk(POSD.s).replace(/\. ?/g,'.').replace(/\.$/,'')} 발령.xlsx`,data:new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})});
    S.fmsg='';toastMsg(`집계표 엑셀을 내려받았습니다. (${J.length}개 학과(부), ${rows.length}개 보직)`);
  }catch(e){const c=e&&e.code;S.fmsg=c==='declined'?'':c==='rate_limited'?'잠시 후 다시 시도하세요.':'엑셀을 만들지 못했습니다. 다시 시도하세요.'}
  render();
}

function lsRank(j,u){const A=lsAps(j,u).filter(a=>a.res==='적격'&&String(a.score).trim()!==''),sc=a=>+a.score;

  Object.entries(LCRD).forEach(([k,v])=>{const j=+k,f=LCR[j],at='10.20 11:30';

/* ===== 브라우저 저장: 입력값은 localStorage(hr-demo-v1), 첨부 파일은 IndexedDB ===== */
const SAVE_KEY='hr-demo-v1',SAVE_VER=8,IDB_NAME='hr-demo-files';
const PERSIST={SCHED,POSD,ADT,PROFS,ROSTER,ST,FA,FN,OPIN,EVAL,MIN,FOR_ST,COL,NCOL,NC_ROUND,LSC,NL,NLS,AD,ADS,PS,SAB,RL,REAP,ADR,ADRS,LCR,LCRS,LCC,LR,LRS,ADRT,COLLEGE,COLLEGE_LIST,COLLEGE_STAFF};
const BID=new WeakMap(),STORED=new Set();let bseq=0,saveT=0,saving=Promise.resolve(),ready=false;
const idbDo=(mode,fn)=>new Promise((ok,no)=>{
  if(!window.indexedDB){no(new Error('no idb'));return}
  const r=indexedDB.open(IDB_NAME,1);
  r.onupgradeneeded=()=>r.result.createObjectStore('f');
  r.onerror=()=>no(r.error);
  r.onsuccess=()=>{const db=r.result,tx=db.transaction('f',mode);let q;
    try{q=fn(tx.objectStore('f'))}catch(e){db.close();no(e);return}
    tx.oncomplete=()=>{db.close();ok(q&&q.result)};tx.onerror=tx.onabort=()=>{db.close();no(tx.error)}};
});
function collect(){
  const used=new Map();
  const json=JSON.stringify({v:SAVE_VER,TERM,SID,d:PERSIST},(k,v)=>{
    if(v instanceof ArrayBuffer){let id=BID.get(v);if(!id){id='b'+Date.now().toString(36)+(++bseq);BID.set(v,id)}used.set(id,v);return {__ab:id}}
    if(v instanceof Set)return {__set:[...v]};
    return v});
  return {json,used};
}
function saveWarn(msg){
  let el=document.getElementById('savewarn');
  if(!msg){if(el)el.remove();return}
  if(!el){el=document.createElement('div');el.id='savewarn';el.setAttribute('role','status');el.style.cssText='position:fixed;right:16px;bottom:16px;z-index:40;max-width:360px;padding:12px 16px;background:#002b49;color:#fff;font-size:13px;line-height:1.6';document.body.appendChild(el)}
  el.textContent=msg;
}
function persistSoon(){if(!ready)return;clearTimeout(saveT);saveT=setTimeout(()=>{saving=saving.then(persistNow)},300)}
async function persistNow(){
  if(!ready)return;
  saveT=0;
  try{
    const c=collect(),need=[...c.used].filter(([id])=>!STORED.has(id));
    if(need.length){await idbDo('readwrite',st=>{need.forEach(([id,b])=>st.put(b,id))});need.forEach(([id])=>STORED.add(id))}
    localStorage.setItem(SAVE_KEY,c.json);
    const drop=[...STORED].filter(id=>!c.used.has(id));
    if(drop.length){await idbDo('readwrite',st=>{drop.forEach(id=>st.delete(id))});drop.forEach(id=>STORED.delete(id))}
    saveWarn('');
  }catch(e){
    saveWarn('저장 공간이 부족하거나 저장할 수 없어 최근 변경이 이 브라우저에 저장되지 않았습니다. 첨부 파일을 줄이거나 직원 메뉴의 [데모 데이터 초기화]를 이용해 주세요.');
  }
}
function assignInto(t,src){
  if(Array.isArray(t)){t.length=0;src.forEach(x=>t.push(x))}
  else{Object.keys(t).forEach(k=>delete t[k]);Object.assign(t,src)}
}
async function restore(){
  let raw=null;try{raw=localStorage.getItem(SAVE_KEY)}catch(_){}
  if(!raw)return;
  try{
    if(JSON.parse(raw).v!==SAVE_VER)throw new Error('version');
    const files=new Map();
    try{await idbDo('readonly',st=>{st.openCursor().onsuccess=e=>{const c=e.target.result;if(c){files.set(c.key,c.value);c.continue()}}})}catch(_){}
    const d=JSON.parse(raw,(k,v)=>{
      if(v&&typeof v==='object'&&!Array.isArray(v)){
        if('__ab' in v){const b=files.get(v.__ab)||new ArrayBuffer(0);BID.set(b,v.__ab);return b}
        if('__set' in v)return new Set(v.__set)}
      return v});
    if(!d.d)throw new Error('shape');
    for(const k of Object.keys(PERSIST))if(d.d[k]!=null&&typeof d.d[k]!==typeof PERSIST[k])throw new Error('shape '+k);
    for(const k of Object.keys(PERSIST))if(d.d[k]!=null)assignInto(PERSIST[k],d.d[k]);
    if(typeof d.TERM==='string')TERM=d.TERM;
    if(Number.isFinite(d.SID))SID=d.SID;
    files.forEach((_,id)=>STORED.add(id));
  }catch(e){
    console.warn('저장된 데이터를 읽지 못해 처음 상태로 시작합니다.',e);
    try{localStorage.removeItem(SAVE_KEY)}catch(_){}
  }
}
async function resetDemo(){
  clearTimeout(saveT);ready=false;
  try{localStorage.removeItem(SAVE_KEY)}catch(_){}
  try{await new Promise(ok=>{const r=indexedDB.deleteDatabase(IDB_NAME);r.onsuccess=r.onerror=r.onblocked=ok})}catch(_){}
  location.reload();
}
['input','change'].forEach(ev=>document.addEventListener(ev,persistSoon));
addEventListener('pagehide',()=>{
  if(!ready||!saveT)return;
  try{const c=collect();if([...c.used.keys()].every(id=>STORED.has(id)))localStorage.setItem(SAVE_KEY,c.json)}catch(_){}
});
restore().catch(()=>{}).then(()=>{ready=true;render()});
/* 미리 들어가 있는 서명(시연용)도 배경 없는 PNG로 바꿔 둠 */
function textSig(name){const c=document.createElement('canvas');c.width=260;c.height=100;const x=c.getContext('2d');x.font='60px "Nanum Pen Script", cursive';x.fillStyle='#111';x.textBaseline='middle';x.textAlign='center';x.fillText(name,130,52);return c.toDataURL('image/png')}
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{
  FA.forEach((f,j)=>{if(f.sign&&!f.sign.img)f.sign.img=textSig(f.sign.name)});
  ROSTER.forEach(R=>R.forEach(p=>{if(p.signed&&!p.head&&!p.sig)p.sig=textSig(p.name)}));
  MIN.forEach((m,j)=>{if(m.head&&!m.head.img)m.head.img=textSig(m.head.name);m.ps.forEach((q,i)=>{if(q.signed&&ROSTER[j][i])q.sig=textSig(ROSTER[j][i].name)})});
  [...PS,...NL,...AD,...LR,...LSC.filter(Boolean)].forEach(f=>{if(f.sign&&!f.sign.img)f.sign.img=textSig(f.sign.name)});
  LCR.forEach((f,j)=>{if(f.head&&!f.head.img)f.head.img=textSig(f.head.name);f.ps.forEach((q,i)=>{if(q.signed&&!q.sig&&ROSTER[j][i])q.sig=textSig(ROSTER[j][i].name)})});
  Object.values(LCC).forEach(x=>{if(x.sign&&!x.sign.img)x.sign.img=textSig(x.sign.name)});
  ADR.forEach((f,j)=>{if(f.head&&!f.head.img)f.head.img=textSig(f.head.name);f.ps.forEach((q,i)=>{if(q.signed&&!q.sig&&ROSTER[j][i])q.sig=textSig(ROSTER[j][i].name)})});
  SAB.forEach(r=>{if(r.sign&&!r.sign.img)r.sign.img=textSig(r.sign.name);if(r.hsign&&!r.hsign.img)r.hsign.img=textSig(r.hsign.name)});
  EVAL.forEach(E=>Object.values(E).forEach(e=>{if(e.sign&&!e.sign.img)e.sign.img=textSig(e.sign.name)}));
  render();
});
})();
